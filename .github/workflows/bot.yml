name: Crypto Wallet Bot

on:
  schedule:
    - cron: "0,45 2-20 * * *"
  workflow_dispatch:

# Prevent concurrent runs from clobbering data/
concurrency:
  group: bot-discovery
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          # Optional: set ETHERSCAN_PLAN_TIER if you have a paid plan (lite, standard, advanced, professional)
          # Default is "free" which filters out BSC/Base/OP/Avalanche (paid-tier-only chains)
          ETHERSCAN_PLAN_TIER: ${{ secrets.ETHERSCAN_PLAN_TIER }}
        run: python bot.py

      # NOTE: no data commit step — data/ must never be pushed to GitHub.
      # git-auto-commit-action force-adds even gitignored files, which is how
      # wallets.csv / trades.csv / whale_alerts.csv ended up in the repo history.
      # Discovery data is ephemeral here; persistent data lives on the local
      # machine only.
