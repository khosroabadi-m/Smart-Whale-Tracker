name: Nightly Monitor & Cleanup

# Scheduled runs were disabled: this job ran against the CI checkout, whose
# data/ is empty (data must never be committed to GitHub), so it produced a
# meaningless empty report and its auto-commit step kept pushing runtime data
# (wallets.csv, whale_alerts.csv, …) into the repo history.
# The real nightly job runs on the local machine. Run manually via
# "Run workflow" only if you ever move data persistence back to CI.
on:
  workflow_dispatch:

# Prevent concurrent runs from clobbering data/
concurrency:
  group: nightly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run nightly monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          # Optional: set ETHERSCAN_PLAN_TIER if you have a paid plan (lite, standard, advanced, professional)
          # Default is "free" which filters out BSC/Base/OP/Avalanche (paid-tier-only chains)
          ETHERSCAN_PLAN_TIER: ${{ secrets.ETHERSCAN_PLAN_TIER }}
        run: python monitor_nightly.py

      - name: Generate dashboard
        run: python dashboard.py

      # NOTE: no data commit step — data/ must never be pushed to GitHub.
