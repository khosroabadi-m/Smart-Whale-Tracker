name: Nightly Monitor & Cleanup

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

# Prevent concurrent runs from clobbering data/
concurrency:
  group: nightly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run nightly monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          # Optional: set ETHERSCAN_PLAN_TIER if you have a paid plan (lite, standard, advanced, professional)
          # Default is "free" which filters out BSC/Base/OP/Avalanche (paid-tier-only chains)
          ETHERSCAN_PLAN_TIER: ${{ secrets.ETHERSCAN_PLAN_TIER }}
        run: python monitor_nightly.py

      - name: Generate dashboard
        run: python dashboard.py

      - name: Commit data changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: nightly scores, sells & cleanup"
          file_pattern: data/
          skip_dirty_check: false
