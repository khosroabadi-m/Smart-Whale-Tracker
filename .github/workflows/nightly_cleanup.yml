name: Nightly Signal Monitor & Cleanup

on:
  schedule:
    - cron: "30 22 * * *"  # ۲:۳۰ بامداد به وقت تهران
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # برای نوشتن/حذف در مخزن

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run nightly monitor & cleanup
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python monitor_nightly.py

      - name: Commit changes (updates + deletions)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            Nightly monitor:
            - Updated wallet scores
            - Removed inactive wallets (>30 days)
          file_pattern: wallets_db.json
          skip_dirty_check: false
          skip_fetch: false
          push_options: '--force-with-lease'
